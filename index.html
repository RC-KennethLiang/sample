<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e293b, #0b1120);
      color: #e2e8f0;
    }
    main { text-align: center; max-width: 34rem; }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.25rem, 8vw, 3.5rem);
      letter-spacing: -0.02em;
    }
    p { margin: 0; color: #94a3b8; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: 0.8rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world! 👋</h1>
    <p>This page is served by nginx inside a Docker container, deployed with Coolify.</p>
    <span class="badge">nginx · alpine · port 80</span>
  </main>
</body>
</html>
